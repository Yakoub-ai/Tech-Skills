[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-skills"
version = "2.2.0"
description = "200+ production-ready AI agent skills for Claude Code and GitHub Copilot. Agentic architecture with 93% token reduction."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "yakoub-ai"}
]
keywords = [
    "claude",
    "claude-code",
    "github-copilot",
    "copilot",
    "ai-agents",
    "skills",
    "llm",
    "enterprise",
    "vscode",
    "project-health",
    "code-hardening",
    "security-hardening",
    "maintenance",
    "developer-productivity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"

[project.scripts]
tech-skills = "tech_skills.cli:main"

[project.urls]
Homepage = "https://github.com/yakoub-ai/Tech-Skills"
Repository = "https://github.com/yakoub-ai/Tech-Skills"

[tool.setuptools.packages.find]
where = ["."]
include = ["tech_skills*"]

[tool.setuptools.package-data]
tech_skills = ["skills/*.md", "roles/**/*.md"]
